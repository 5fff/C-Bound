<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C-Bound Proximity Verification</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-sizing: border-box;
        }
        @media (max-width: 600px) {
            .card { padding: 30px 20px; }
            h1 { font-size: 1.5rem; }
        }
        h1 {
            color: #bb86fc;
            margin-top: 0;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #bb86fc;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
        <div class="spinner"></div>
        <div id="status">Verifying connection...</div>
    </div>

    <script>
        document.write('<script src="/public/qrcode.min.js?v=' + new Date().getTime() + '"><\/script>');
        document.write('<script src="/public/client.min.js?v=' + new Date().getTime() + '"><\/script>');
    </script>
</body>
</html>
